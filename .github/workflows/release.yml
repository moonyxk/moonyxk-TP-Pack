name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create zip
        run: |
          zip -r "moonyxk Pack.zip" . -x ".git/*" ".github/*"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ github.run_number }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          gh release create "$TAG" "moonyxk Pack.zip#moonyxk Pack.zip" \
            --target "$GITHUB_SHA" \
            --title "moonyxk Pack $TAG" \
            --notes "Automatischer Release für Commit $SHORT_SHA: $(git log -1 --pretty=%s)"
