name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create zip
        run: |
          zip -r "moonyxk Pack.zip" . -x ".git/*" ".github/*" "README.md"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ github.run_number }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          gh release create "$TAG" "moonyxk Pack.zip#moonyxk Pack.zip" \
            --target "$GITHUB_SHA" \
            --title "moonyxk Pack $TAG" \
            --notes "Automatischer Release für Commit $SHORT_SHA: $(git log -1 --pretty=%s)"

      # Pushes made with GITHUB_TOKEN do not trigger this workflow again.
      - name: Update README download link
        run: |
          TAG="v${{ github.run_number }}"
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/moonyxk.Pack.zip"
          LINE="Aktuelle Version: **$TAG** – [moonyxk.Pack.zip]($URL)"
          awk -v line="$LINE" '
            /<!-- LATEST-RELEASE:START -->/ { print; print line; skip=1; next }
            /<!-- LATEST-RELEASE:END -->/ { skip=0 }
            !skip
          ' README.md > README.tmp && mv README.tmp README.md
          if git diff --quiet README.md; then
            echo "README already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README download link to $TAG [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
